# SOURCE DESIGN ONLY. Candidate settings not executed/validated by Neo4j.
# Private isolated loopback fixture, NEVER production configuration.
server.config.strict_validation.enabled=true
server.directories.data=/tmp/neo4j-runtime/data
server.directories.logs=/tmp/neo4j-runtime/logs
server.directories.run=/tmp/neo4j-runtime/run
server.directories.plugins=/tmp/neo4j-runtime/plugins-empty
server.directories.import=/tmp/neo4j-runtime/import-empty
server.directories.transaction.logs.root=/tmp/neo4j-runtime/transactions
server.logs.config=/tmp/neo4j-runtime/conf/server-logs.xml
server.logs.user.config=/tmp/neo4j-runtime/conf/user-logs.xml
server.memory.heap.initial_size=512m
server.memory.heap.max_size=512m
server.memory.pagecache.size=128m
server.default_listen_address=127.0.0.1
server.default_advertised_address=127.0.0.1
server.bolt.enabled=true
server.bolt.listen_address=127.0.0.1:7787
server.bolt.advertised_address=127.0.0.1:7787
server.bolt.thread_pool_min_size=2
server.bolt.thread_pool_max_size=8
server.http.enabled=true
server.http.listen_address=127.0.0.1:7474
server.http.advertised_address=127.0.0.1:7474
server.https.enabled=false
# Only because fixture is synthetic and namespace has no external network.
dbms.security.auth_enabled=false
dbms.usage_report.enabled=false
db.tx_log.preallocate=false
db.tx_log.rotation.size=16M
db.tx_log.rotation.retention_policy=2 files
db.store.files.preallocate=false
db.transaction.timeout=10s
db.shutdown_transaction_end_timeout=10s
server.jvm.additional=-XX:+UseG1GC
server.jvm.additional=-XX:-OmitStackTraceInFastThrow
server.jvm.additional=-XX:+DisableExplicitGC
server.jvm.additional=-XX:ActiveProcessorCount=2
server.jvm.additional=-Djdk.nio.maxCachedBufferSize=1024
server.jvm.additional=-Dio.netty.tryReflectionSetAccessible=true
server.jvm.additional=--add-opens=java.base/java.nio=ALL-UNNAMED
server.jvm.additional=--add-opens=java.base/java.io=ALL-UNNAMED
server.jvm.additional=--add-opens=java.base/sun.nio.ch=ALL-UNNAMED
server.jvm.additional=--enable-native-access=ALL-UNNAMED
server.jvm.additional=-Dlog4j2.disable.jmx=true
server.jvm.additional=-Djava.io.tmpdir=/tmp/neo4j-runtime/java-tmp
server.jvm.additional=-Djna.tmpdir=/tmp/neo4j-runtime/java-tmp
server.jvm.additional=-XX:ErrorFile=/tmp/neo4j-runtime/logs/hs_err_pid%p.log
server.jvm.additional=-XX:-HeapDumpOnOutOfMemoryError
