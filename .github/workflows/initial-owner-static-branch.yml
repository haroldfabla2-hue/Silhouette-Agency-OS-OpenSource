name: Initial-owner static then two-case runtime trial (exact isolated branch)

on:
  push:
    branches:
      - validation/initial-owner-static-reviewed-20261112

permissions:
  contents: read

jobs:
  focused-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Initialize evidence location on runner
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/initial-owner-static-evidence"
          mkdir -p "$evidence"
          test -w "$evidence"
          printf 'EVIDENCE_WRITABLE\n' > "$evidence/write-check.txt"
          printf 'EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"

      - name: Checkout exact pushed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify pushed commit and reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test -w "$EVIDENCE"
          printf 'EVIDENCE_WRITABLE\n' > "$EVIDENCE/write-check.txt"
          actual=$(git rev-parse HEAD)
          printf '%s\n' "$actual" > "$EVIDENCE/head.txt"
          printf '%s\n' "$EXPECTED_COMMIT_SHA" > "$EVIDENCE/expected-head.txt"
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$actual" = "$EXPECTED_COMMIT_SHA"
          git status --porcelain > "$EVIDENCE/checkout-status.txt"
          sha256sum package.json package-lock.json services/continuumMemory.ts services/memoryTransitions.ts services/introspectionEngine.ts tsconfig.json tsconfig.introspection-fixture.json tests/real-process/introspection-initial/initial-status-consumer.mts tests/real-process/introspection-initial/run-two.py tests/real-process/introspection-initial/run-runtime.sh > "$EVIDENCE/input-sha256.txt"
          set +e
          sha256sum --check tests/real-process/introspection-initial/reviewed-inputs.sha256 2>&1 | tee "$EVIDENCE/reviewed-input-check.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$EVIDENCE/reviewed-input-check.exit"
          printf '%s\n' "${codes[1]}" > "$EVIDENCE/reviewed-input-check.tee-exit"
          test "${codes[0]}" = 0
          test "${codes[1]}" = 0
          printf 'PUSH_HEAD_AND_REVIEWED_BYTES_MATCH\n' > "$EVIDENCE/head-check.txt"

      - name: Setup exact existing CI Node floor
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Existing pinned lock install
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          test -w "$EVIDENCE"
          node --version > "$EVIDENCE/node-version.txt"
          npm --version > "$EVIDENCE/npm-version.txt"
          set +e
          timeout --signal=TERM --kill-after=5s 300s npm ci 2>&1 | tee "$EVIDENCE/npm-ci.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$EVIDENCE/npm-ci.exit"
          printf '%s\n' "${codes[1]}" > "$EVIDENCE/npm-ci.tee-exit"
          test "${codes[0]}" = 0
          test "${codes[1]}" = 0

      - name: All three static checks, aggregate failure
        shell: bash
        run: |
          set -euo pipefail
          test -w "$EVIDENCE"
          run_check() {
            name=$1
            shift
            set +e
            timeout --signal=TERM --kill-after=5s 180s "$@" 2>&1 | tee "$EVIDENCE/$name.log"
            codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${codes[0]}" > "$EVIDENCE/$name.exit"
            printf '%s\n' "${codes[1]}" > "$EVIDENCE/$name.tee-exit"
          }
          # Deliberate diagnostic policy: run all three even if lint/TSC fail.
          # Recording/tee failures never turn a nonzero command into success.
          run_check lint npm run lint
          run_check tsc-production npm run typecheck
          run_check tsc-fixture node node_modules/typescript/bin/tsc --project tsconfig.introspection-fixture.json
          result=0
          for name in lint tsc-production tsc-fixture; do
            test "$(cat "$EVIDENCE/$name.exit")" = 0 || result=1
            test "$(cat "$EVIDENCE/$name.tee-exit")" = 0 || result=1
          done
          printf '%s\n' "$result" > "$EVIDENCE/aggregate.exit"
          if test "$result" = 0; then printf 'STATIC_PASS\n' > "$EVIDENCE/static-pass.txt"; fi
          exit "$result"

      - name: Reviewed Ubuntu sandbox setup on ephemeral VM
        shell: bash
        run: |
          set -euo pipefail
          run_setup() {
            name=$1
            shift
            set +e
            timeout --signal=TERM --kill-after=5s 120s "$@" 2>&1 | tee "$EVIDENCE/$name.log"
            codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${codes[0]}" > "$EVIDENCE/$name.exit"
            printf '%s\n' "${codes[1]}" > "$EVIDENCE/$name.tee-exit"
            test "${codes[0]}" = 0
            test "${codes[1]}" = 0
          }
          . /etc/os-release
          test "$ID:$VERSION_ID:$(dpkg --print-architecture)" = ubuntu:24.04:amd64
          # Default signed Ubuntu repositories only. No PPA, curl or new source.
          source=/etc/apt/sources.list.d/ubuntu.sources
          run_setup sandbox-sources python3 -c 'import pathlib,re; p=pathlib.Path("/etc/apt/sources.list.d/ubuntu.sources"); t=p.read_text(); urls=[u for line in t.splitlines() if line.startswith("URIs:") for u in line[5:].split()]; assert urls and all(re.fullmatch(r"https?://(?:[a-z0-9.-]+\.)?ubuntu\.com/ubuntu/?",u) for u in urls), "Unexpected Ubuntu source URI"; assert "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" in t and not re.search(r"(?im)^(?:Trusted|Allow-Insecure|Allow-Weak):\s*yes",t), "Unexpected trust options"; print(t)'
          # Only this verified existing Ubuntu source file, no other default vendor sources.
          # Package lists stay ephemeral outside retained evidence.
          lists="$RUNNER_TEMP/initial-owner-ubuntu-lists"
          mkdir "$lists"
          apt_options=(-o "Dir::Etc::sourcelist=$source" -o Dir::Etc::sourceparts=- -o "Dir::State::lists=$lists")
          missing=()
          command -v bwrap >/dev/null || missing+=(bubblewrap)
          command -v ip >/dev/null || missing+=(iproute2)
          if test "${#missing[@]}" != 0; then
            run_setup sandbox-apt-update sudo -n apt-get "${apt_options[@]}" update
            pins=()
            for pkg in "${missing[@]}"; do
              apt-cache "${apt_options[@]}" policy "$pkg" | tee "$EVIDENCE/sandbox-$pkg-policy.log"
              candidate=$(apt-cache "${apt_options[@]}" policy "$pkg" | awk '/Candidate:/ {print $2}')
              test -n "$candidate" && test "$candidate" != '(none)'
              pins+=("$pkg=$candidate")
            done
            run_setup sandbox-apt-simulate apt-get "${apt_options[@]}" --simulate --no-install-recommends --no-upgrade --no-remove install "${pins[@]}"
            # Do not upgrade installed dependencies or remove packages.
            while read -r pkg; do
              if dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null | grep -qx installed; then
                printf 'BLOCKED: proposed upgrade of installed %s\n' "$pkg"
                exit 1
              fi
            done < <(awk '$1=="Inst" {print $2}' "$EVIDENCE/sandbox-apt-simulate.log")
            run_setup sandbox-apt-install sudo -n apt-get "${apt_options[@]}" --yes --no-install-recommends --no-upgrade --no-remove install "${pins[@]}"
          fi
          run_setup sandbox-package-versions dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' bubblewrap iproute2
          run_setup sandbox-bwrap-version bwrap --version
          run_setup sandbox-ip-version ip -Version
          key=kernel.apparmor_restrict_unprivileged_userns
          run_setup sandbox-apparmor-before sysctl -n "$key"
          before=$(tail -n1 "$EVIDENCE/sandbox-apparmor-before.log")
          case "$before" in
            0) ;;
            1) run_setup sandbox-apparmor-set sudo -n sysctl -w "$key=0" ;;
            *) printf 'BLOCKED: unexpected AppArmor sysctl value\n'; exit 1 ;;
          esac
          run_setup sandbox-apparmor-after sysctl -n "$key"
          test "$(tail -n1 "$EVIDENCE/sandbox-apparmor-after.log")" = 0
          printf 'SETUP_COMPLETE_NOT_RUNTIME_PASS\n' > "$EVIDENCE/sandbox-setup.txt"

      - name: Exact two-case runtime trial after static PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$EVIDENCE/static-pass.txt")" = STATIC_PASS
          printf 'NOT_STARTED\n' > "$EVIDENCE/runtime-status.txt"
          # No package installation, sudo, external Redis, or alternate path.
          # A missing tool is a trial capability result, before app workload.
          for tool in bwrap ip; do
            if ! command -v "$tool" >> "$EVIDENCE/runtime-capability.log" 2>&1; then
              printf 'BLOCKED: missing %s before app workload\n' "$tool" | tee -a "$EVIDENCE/runtime-capability.log"
              printf 'BLOCKED\n' > "$EVIDENCE/runtime-status.txt"
              exit 1
            fi
          done
          set +e
          timeout --signal=TERM --kill-after=5s 100s env -i PATH="$PATH" HOME=/tmp /bin/bash tests/real-process/introspection-initial/run-runtime.sh "$EVIDENCE" "$EVIDENCE/runtime" 2>&1 | tee "$EVIDENCE/runtime-trial.log"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$EVIDENCE/runtime-command.exit"
          printf '%s\n' "${codes[1]}" > "$EVIDENCE/runtime-tee.exit"
          if test "${codes[0]}" != 0 || test "${codes[1]}" != 0; then
            printf 'FAIL (inspect log for BLOCKED capability/network or case failure)\n' > "$EVIDENCE/runtime-status.txt"
            exit 1
          fi
          printf 'PASS\n' > "$EVIDENCE/runtime-status.txt"

      - name: Always retain bounded evidence in job logs only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Job logs do not count toward artifact storage allowance. No upload/cache.
          python3 - "$EVIDENCE" <<'PY'
          import base64, hashlib, io, pathlib, sys, tarfile
          root = pathlib.Path(sys.argv[1])
          files = sorted(p for p in root.rglob('*') if p.is_file() and not p.is_symlink())
          if len(files) > 128 or sum(p.stat().st_size for p in files) > 2 * 1024 * 1024:
              raise SystemExit('EVIDENCE_LIMIT_FAIL: too many files or more than2MiB raw')
          out = io.BytesIO()
          with tarfile.open(fileobj=out, mode='w:gz') as archive:
              for file in files:
                  archive.add(file, arcname=str(file.relative_to(root)), recursive=False)
          data = out.getvalue()
          if len(data) > 512 * 1024:
              raise SystemExit('EVIDENCE_LIMIT_FAIL: compressed evidence above512KiB')
          print('FOCUSED_EVIDENCE_SHA256:' + hashlib.sha256(data).hexdigest())
          print('FOCUSED_EVIDENCE_BYTES:' + str(len(data)))
          print('FOCUSED_EVIDENCE_BASE64_BEGIN')
          text = base64.b64encode(data).decode('ascii')
          for start in range(0, len(text), 4096):
              print(text[start:start + 4096])
          print('FOCUSED_EVIDENCE_BASE64_END')
          PY
