name: Narrow actual poll and bootstrap owners Node22.18 only

on:
  push:
    branches:
      - validation/initial-owner-static-reviewed-20261112

permissions:
  contents: read

jobs:
  current-isolated-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Anchor conservative job deadline before checkout
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/current-suite-evidence"
          mkdir "$evidence"
          printf 'EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          python3 - "$evidence" <<'CLOCK'
          import json,os,pathlib,sys,time
          ev=pathlib.Path(sys.argv[1]);hz=os.sysconf('SC_CLK_TCK');pid=os.getpid();anchor=None
          for _ in range(64):
           p=pathlib.Path('/proc')/str(pid);s=(p/'stat').read_text();f=s[s.rindex(')')+2:].split()
           if (p/'comm').read_text().strip()=='Runner.Worker':
            anchor={'pid':pid,'start_ticks':int(f[19])};break
           pid=int(f[1])
           if pid<=1:break
          assert anchor is not None,'No Runner.Worker conservative start; STOP'
          (ev/'job-clock.json').write_text(json.dumps({'anchor':'Runner.Worker start before job start','worker':anchor,'ticks_per_second':hz,'deadline_monotonic':anchor['start_ticks']/hz+900,'observed_monotonic':time.monotonic(),'observed_utc_epoch':time.time(),'cleanup_export_reserve_seconds':60,'job_limit_seconds':900},indent=2))
          (ev/'host-budget.json').write_text(json.dumps({'elapsed_seconds':0,'observed_bytes':0,'retained_bytes':0,'commands':[]},indent=2))
          CLOCK
      - name: Checkout exact reviewed push
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and external read-only reviewed manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git status --porcelain > "$EVIDENCE/checkout-status.txt"
          reviewed="$RUNNER_TEMP/current-suite-reviewed"
          mkdir "$reviewed"
          cp tests/real-process/fullsuite/reviewed-inputs.sha256 "$reviewed/inputs.sha256"
          chmod 0444 "$reviewed/inputs.sha256"
          printf '%s  %s\n' e90987478ac0a868dbed889c024b405f9acfa8fb4210480650a4c302e1cae31c "$reviewed/inputs.sha256" | sha256sum --check
          printf 'REVIEWED=%s\n' "$reviewed" >> "$GITHUB_ENV"
          work="$RUNNER_TEMP/current-suite-work"
          python3 tests/real-process/fullsuite/prepare-work.py "$work" "$EVIDENCE"
          printf '%s  %s\n' f620fbb142f7011b60aa171160e049cc3af3beeacc11e3d47bb518624c8ef684 tests/real-process/fullsuite/verify-tree.py | sha256sum --check
          python3 tests/real-process/fullsuite/verify-tree.py "$work" "$reviewed/inputs.sha256" e90987478ac0a868dbed889c024b405f9acfa8fb4210480650a4c302e1cae31c "$EVIDENCE/pre-install-tree.json"
          printf 'WORK=%s\n' "$work" >> "$GITHUB_ENV"
      - name: Exact Node floor
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Bounded host install existing lock and verify exact work tree
        shell: bash
        run: |
          set -euo pipefail
          node --version > "$EVIDENCE/node-version.txt"
          npm --version > "$EVIDENCE/npm-version.txt"
          # Explicit clean install environment; same browser skip settings/lifecycle.
          control="$PWD/tests/real-process/fullsuite/host-control.py"
          cd "$WORK"
          python3 "$control" capture npm-ci 300 env -i PATH="$PATH" HOME="$RUNNER_TEMP/current-suite-install-home" PUPPETEER_SKIP_DOWNLOAD=true PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=true npm ci
          cd "$GITHUB_WORKSPACE"
          printf '%s  %s\n' f620fbb142f7011b60aa171160e049cc3af3beeacc11e3d47bb518624c8ef684 tests/real-process/fullsuite/verify-tree.py | sha256sum --check
          python3 tests/real-process/fullsuite/verify-tree.py "$WORK" "$REVIEWED/inputs.sha256" e90987478ac0a868dbed889c024b405f9acfa8fb4210480650a4c302e1cae31c "$EVIDENCE/post-install-tree.json"
      - name: Explicit one security candidate only, no APT configuration or install
        shell: bash
        run: |
          set -euo pipefail
          control="$PWD/tests/real-process/fullsuite/host-control.py"
          run_setup() { name=$1; shift; python3 "$control" capture "$name" 180 "$@"; }
          # Read-only host identity, no shell sourcing host configuration.
          run_setup security-host python3 - <<'HOST'
          import pathlib,subprocess
          text=pathlib.Path('/etc/os-release').read_text();d=dict(l.split('=',1) for l in text.splitlines() if '=' in l)
          assert d['ID'].strip('"')=='ubuntu' and d['VERSION_ID'].strip('"')=='24.04'
          assert subprocess.check_output(['dpkg','--print-architecture'],timeout=2).strip()==b'amd64'
          HOST
          # Copy only exact independently pinned key bytes; root-owned immutable for this trial.
          run_setup security-key-snapshot python3 - "$RUNNER_TEMP/security-key.gpg" <<'KEY'
          import hashlib,os,pathlib,stat,sys
          p=pathlib.Path('/usr/share/keyrings/ubuntu-archive-keyring.gpg');fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW)
          with os.fdopen(fd,'rb') as f:
           a=os.fstat(f.fileno());assert stat.S_ISREG(a.st_mode) and a.st_uid==0 and a.st_size==3607
           b=f.read(16385);z=os.fstat(f.fileno());assert len(b)==3607 and (a.st_dev,a.st_ino,a.st_size,a.st_mtime_ns,a.st_ctime_ns)==(z.st_dev,z.st_ino,z.st_size,z.st_mtime_ns,z.st_ctime_ns)
          assert hashlib.sha256(b).hexdigest()=='80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31'
          target=pathlib.Path(sys.argv[1]);fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'wb') as f:f.write(b)
          KEY
          run_setup security-root-scope sudo -n mktemp -d /run/initial-owner-apt.XXXXXXXX
          secure=$(tail -n1 "$EVIDENCE/security-root-scope.log")
          [[ "$secure" =~ ^/run/initial-owner-apt\.[A-Za-z0-9]{8}$ ]]
          printf 'APT_TRIAL_SCOPE=%s\n' "$secure" >> "$GITHUB_ENV"
          run_setup security-key-copy sudo -n install -o root -g root -m 0444 "$RUNNER_TEMP/security-key.gpg" "$secure/ubuntu-archive-keyring.gpg"
          run_setup security-root-freeze sudo -n chmod 0555 "$secure"
          stage="$RUNNER_TEMP/security-bwrap-stage"
          mkdir -m 0700 "$stage"
          printf 'SECURITY_STAGE=%s\n' "$stage" >> "$GITHUB_ENV"
          printf '{"status":"UNSAFE","reason":"acquire not yet safely completed"}\n' > "$EVIDENCE/security-helpers-state.json"
          run_setup security-chain python3 tests/real-process/security-setup/acquire.py "$stage" "$secure/ubuntu-archive-keyring.gpg"
          # Namespace policy is the original AppArmor sysctl only. No staged-path profile, setuid, privileged fallback.
          key=kernel.apparmor_restrict_unprivileged_userns
          run_setup sandbox-apparmor-before sysctl -n "$key"
          before=$(tail -n1 "$EVIDENCE/sandbox-apparmor-before.log")
          case "$before" in
            0) ;;
            1) run_setup sandbox-apparmor-set sudo -n sysctl -w "$key=0" ;;
            *) printf 'BLOCKED: unexpected AppArmor value\n'; exit 1 ;;
          esac
          run_setup sandbox-apparmor-after sysctl -n "$key"
          test "$(tail -n1 "$EVIDENCE/sandbox-apparmor-after.log")" = 0
          printf 'SETUP_COMPLETE_NOT_RUNTIME_PASS\n' > "$EVIDENCE/sandbox-setup.txt"
      - name: Admit session only if absolute job budget fits plus cleanup and export
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE/security-helpers-state.json" <<'SAFE'
          import json,pathlib,sys
          s=json.loads(pathlib.Path(sys.argv[1]).read_text());assert s['status']=='SAFE' and not s['active'] and not s['sticky_unsafe'] and not s['signals'],'UNSAFE helpers: no session admission'
          SAFE
          python3 tests/real-process/fullsuite/host-control.py reserve
      - name: Narrow lint types and three actual owner test files checkpoint
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=5s 675s env -i PATH="$PATH" STAGED_BWRAP="$STAGED_BWRAP" SILHOUETTE_INFERENCE_MODE=cloud-only SILHOUETTE_SNAPSHOT_DIAGNOSTIC=metadata-only bash tests/real-process/fullsuite/launch.sh "$WORK" "$EVIDENCE" "$REVIEWED"
          code=$?
          set -e
          printf '%s\n' "$code" > "$EVIDENCE/session-command.exit"
          exit "$code"
      - name: Always remove only this trial root-owned apt scope under reserved cleanup budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -e "$EVIDENCE/security-helpers-state.json"; then
            python3 - "$EVIDENCE/security-helpers-state.json" <<'SAFE'
          import json,pathlib,sys
          s=json.loads(pathlib.Path(sys.argv[1]).read_text());assert s['status']=='SAFE' and not s.get('active') and not s.get('sticky_unsafe') and not s.get('signals'),'UNSAFE helpers: retain owner resources and STOP'
          SAFE
          fi
          if test -z "${APT_TRIAL_SCOPE:-}"; then exit 0; fi
          [[ "$APT_TRIAL_SCOPE" =~ ^/run/initial-owner-apt\.[A-Za-z0-9]{8}$ ]]
          python3 tests/real-process/fullsuite/host-control.py cleanup sandbox-cleanup 20 sudo -n rm -rf --one-file-system -- "$APT_TRIAL_SCOPE"
          test ! -e "$APT_TRIAL_SCOPE"
          rm -rf -- "$RUNNER_TEMP/security-bwrap-stage"
          rm -f -- "$RUNNER_TEMP/security-key.gpg"
      - name: Always retain bounded evidence within reserved deadline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          budget=$(python3 - "$EVIDENCE/job-clock.json" <<'LIMIT'
          import json,pathlib,sys,time
          c=json.loads(pathlib.Path(sys.argv[1]).read_text());v=min(30,int(c['deadline_monotonic']-time.monotonic()-5));assert v>0,'No export budget';print(v)
          LIMIT
          )
          timeout --signal=TERM --kill-after=2s "${budget}s" python3 - "$EVIDENCE" <<'PY'
          import base64,hashlib,io,pathlib,stat,sys,tarfile
          root=pathlib.Path(sys.argv[1]);files=[]
          for p in sorted(root.rglob('*')):
           m=p.lstat()
           if stat.S_ISDIR(m.st_mode):continue
           if not stat.S_ISREG(m.st_mode):raise SystemExit('EVIDENCE_NONREGULAR_FAIL')
           files.append(p)
          count=len(files);raw=sum(p.stat().st_size for p in files)
          print('CURRENT_SUITE_EVIDENCE_FILES:'+str(count),flush=True)
          print('CURRENT_SUITE_EVIDENCE_RAW_BYTES:'+str(raw),flush=True)
          if count>128 or raw>20*1024*1024:raise SystemExit('EVIDENCE_CAP_FAIL_128FILES_20MIB')
          out=io.BytesIO()
          with tarfile.open(fileobj=out,mode='w:gz') as tar:
           for p in files:tar.add(p,arcname=str(p.relative_to(root)),recursive=False)
          data=out.getvalue()
          if len(data)>4*1024*1024:raise SystemExit('EVIDENCE_CAP_FAIL_4MIB_GZIP')
          print('CURRENT_SUITE_EVIDENCE_SHA256:'+hashlib.sha256(data).hexdigest())
          print('CURRENT_SUITE_EVIDENCE_BYTES:'+str(len(data)))
          print('CURRENT_SUITE_EVIDENCE_BASE64_BEGIN')
          text=base64.b64encode(data).decode()
          for i in range(0,len(text),4096):print(text[i:i+4096])
          print('CURRENT_SUITE_EVIDENCE_BASE64_END')
          PY
