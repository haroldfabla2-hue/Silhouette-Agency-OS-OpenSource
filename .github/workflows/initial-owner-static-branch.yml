name: Ubuntu source inspection only (exact isolated branch)
on:
  push:
    branches:
      - validation/initial-owner-static-reviewed-20261112
permissions:
  contents: read
jobs:
  source-inspection-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact inspection source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and inspect existing Ubuntu file only
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          printf 'INSPECTION_HEAD=%s\n' "$EXPECTED_COMMIT_SHA"
          sha256sum --check tests/real-process/introspection-initial/reviewed-inputs.sha256
          set +e
          timeout --signal=TERM --kill-after=5s 15s python3 - > "$RUNNER_TEMP/source-inspection.log" 2>&1 <<'INSPECT'
          import datetime, hashlib, json, os, pathlib, re, urllib.parse
          p = pathlib.Path('/etc/apt/sources.list.d/ubuntu.sources')
          data = p.read_bytes()
          if len(data) > 16384:
              raise SystemExit('INCOMPLETE: source above16KiB, no truncation')
          text = data.decode('utf8', errors='strict')
          print('UBUNTU_SOURCES_BYTES=' + str(len(data)), flush=True)
          print('UBUNTU_SOURCES_SHA256=' + hashlib.sha256(data).hexdigest(), flush=True)
          # A newly allocated VM is not the failed historical VM.
          context = {'timestamp_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'),
                     'os_release': pathlib.Path('/etc/os-release').read_text()}
          if len(context['os_release']) > 4096:
              raise SystemExit('INCOMPLETE: os-release above4KiB')
          print('INSPECTION_NEW_VM_CONTEXT=' + json.dumps(context, ensure_ascii=True), flush=True)
          # Never print an unexpected credential-bearing URI, even in raw source.
          for candidate in re.findall(r'[A-Za-z][A-Za-z0-9+.-]*://[^\s]+', text):
              parsed = urllib.parse.urlsplit(candidate)
              if parsed.username is not None or parsed.password is not None or parsed.query or parsed.fragment:
                  print('SOURCE_REDACTED: unexpected URI userinfo/query/fragment', flush=True)
                  raise SystemExit('FAIL: sensitive URI shape, source body withheld')
          print('UBUNTU_SOURCES_RAW_JSON=' + json.dumps(text, ensure_ascii=True), flush=True)
          uris = [u for line in text.splitlines() if line.startswith('URIs:') for u in line[5:].split()]
          signed_by = [line[10:].strip() for line in text.splitlines() if line.startswith('Signed-By:')]
          print('PARSED_URIS=' + json.dumps(uris, ensure_ascii=True), flush=True)
          print('PARSED_SIGNED_BY=' + json.dumps(signed_by, ensure_ascii=True), flush=True)
          flags = [line for line in text.splitlines() if re.match(r'(?i)^(?:Trusted|Allow-Insecure|Allow-Weak):', line)]
          print('PARSED_TRUST_OPTION_FLAGS=' + json.dumps(flags, ensure_ascii=True), flush=True)
          # Actual Included Software link is emitted in the runner Set up job log.
          print('INCLUDED_SOFTWARE_LINK_SOURCE=runner Set up job / Runner Image / Included Software', flush=True)
          # Existing guard is deliberately unchanged, not a broader allowlist.
          assert uris and all(re.fullmatch(r'https?://(?:[a-z0-9.-]+\.)?ubuntu\.com/ubuntu/?', u) for u in uris), 'Unexpected Ubuntu source URI'
          assert 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' in text and not re.search(r'(?im)^(?:Trusted|Allow-Insecure|Allow-Weak):\s*yes', text), 'Unexpected trust options'
          print('CURRENT_SOURCE_GUARD_PASS_NOT_RUNTIME_PASS', flush=True)
          INSPECT
          code=$?
          set -e
          printf 'SOURCE_INSPECTION_COMMAND_EXIT=%s\n' "$code"
          python3 - "$RUNNER_TEMP/source-inspection.log" <<'ENCODE'
          import base64, hashlib, pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          if len(data) > 65536:
              raise SystemExit('INCOMPLETE: inspection output above64KiB; no truncation')
          print('SOURCE_INSPECTION_LOG_BYTES=' + str(len(data)))
          print('SOURCE_INSPECTION_LOG_SHA256=' + hashlib.sha256(data).hexdigest())
          print('SOURCE_INSPECTION_LOG_BASE64_BEGIN')
          text = base64.b64encode(data).decode('ascii')
          for start in range(0, len(text), 4096):
              print(text[start:start + 4096])
          print('SOURCE_INSPECTION_LOG_BASE64_END')
          ENCODE
          exit "$code"
