name: PROFILE StageA builds native terminal only NO fullsuite verdict

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact approved isolated branch commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  current-isolated-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Anchor conservative job deadline before checkout
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event_name }}' = workflow_dispatch
          test '${{ github.ref }}' = refs/heads/preparation/profile-stageA-source-20261114
          test '${{ github.sha }}' = '${{ inputs.expected_head }}'
          test '${{ github.event.repository.private }}' = false
          test '${{ runner.environment }}' = github-hosted
          evidence="$RUNNER_TEMP/current-suite-evidence"
          mkdir "$evidence"
          printf 'EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          python3 - "$evidence" <<'CLOCK'
          import json,os,pathlib,sys,time
          ev=pathlib.Path(sys.argv[1]);hz=os.sysconf('SC_CLK_TCK');pid=os.getpid();anchor=None
          for _ in range(64):
           p=pathlib.Path('/proc')/str(pid);s=(p/'stat').read_text();f=s[s.rindex(')')+2:].split()
           if (p/'comm').read_text().strip()=='Runner.Worker':
            anchor={'pid':pid,'start_ticks':int(f[19])};break
           pid=int(f[1])
           if pid<=1:break
          assert anchor is not None,'No Runner.Worker conservative start; STOP'
          (ev/'job-clock.json').write_text(json.dumps({'anchor':'Runner.Worker start before job start','worker':anchor,'ticks_per_second':hz,'deadline_monotonic':anchor['start_ticks']/hz+1800,'observed_monotonic':time.monotonic(),'observed_utc_epoch':time.time(),'cleanup_export_reserve_seconds':120,'job_limit_seconds':1800},indent=2))
          (ev/'host-budget.json').write_text(json.dumps({'elapsed_seconds':0,'observed_bytes':0,'retained_bytes':0,'commands':[]},indent=2))
          CLOCK
      - name: Checkout exact reviewed push
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify StageA exact source copy and operational infrastructure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          ops="$PWD/tests/real-process/cp17-trial"
          printf '%s  %s\n' 169888481ad300779ed3782b68bf750c6a36b7e9fd9668764e5e9826623dbb84 "$ops/infrastructure.sha256" | sha256sum --check
          (cd "$ops" && sha256sum --check infrastructure.sha256)
          work="$RUNNER_TEMP/current-suite-work"
          python3 "$ops/prepare-integral.py" "$PWD" "$work" "$ops/integral-inputs.json" 953c7f369666c716376dfcdf32b71e0464406da75b0e1cfe5278ebbf7324869a
          printf 'WORK=%s\n' "$work" >> "$GITHUB_ENV"
      - name: Exact Node floor
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Explicit one security candidate only, no APT configuration or install
        shell: bash
        run: |
          set -euo pipefail
          control="$PWD/tests/real-process/cp17-trial/host-control-reviewed.py"
          run_setup() { name=$1; shift; python3 "$control" capture "$name" 240 "$@"; }
          # Read-only host identity, no shell sourcing host configuration.
          run_setup security-host python3 - <<'HOST'
          import pathlib,subprocess
          text=pathlib.Path('/etc/os-release').read_text();d=dict(l.split('=',1) for l in text.splitlines() if '=' in l)
          assert d['ID'].strip('"')=='ubuntu' and d['VERSION_ID'].strip('"')=='24.04'
          assert subprocess.check_output(['dpkg','--print-architecture'],timeout=2).strip()==b'amd64'
          HOST
          # Copy only exact independently pinned key bytes; root-owned immutable for this trial.
          run_setup security-key-snapshot python3 - "$RUNNER_TEMP/security-key.gpg" <<'KEY'
          import hashlib,os,pathlib,stat,sys
          p=pathlib.Path('/usr/share/keyrings/ubuntu-archive-keyring.gpg');fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW)
          with os.fdopen(fd,'rb') as f:
           a=os.fstat(f.fileno());assert stat.S_ISREG(a.st_mode) and a.st_uid==0 and a.st_size==3607
           b=f.read(16385);z=os.fstat(f.fileno());assert len(b)==3607 and (a.st_dev,a.st_ino,a.st_size,a.st_mtime_ns,a.st_ctime_ns)==(z.st_dev,z.st_ino,z.st_size,z.st_mtime_ns,z.st_ctime_ns)
          assert hashlib.sha256(b).hexdigest()=='80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31'
          target=pathlib.Path(sys.argv[1]);fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'wb') as f:f.write(b)
          KEY
          run_setup security-root-scope sudo -n mktemp -d /run/initial-owner-apt.XXXXXXXX
          secure=$(tail -n1 "$EVIDENCE/security-root-scope.log")
          [[ "$secure" =~ ^/run/initial-owner-apt\.[A-Za-z0-9]{8}$ ]]
          printf 'APT_TRIAL_SCOPE=%s\n' "$secure" >> "$GITHUB_ENV"
          run_setup security-key-copy sudo -n install -o root -g root -m 0444 "$RUNNER_TEMP/security-key.gpg" "$secure/ubuntu-archive-keyring.gpg"
          run_setup security-root-freeze sudo -n chmod 0555 "$secure"
          stage="$RUNNER_TEMP/security-bwrap-stage"
          mkdir -m 0700 "$stage"
          printf 'SECURITY_STAGE=%s\n' "$stage" >> "$GITHUB_ENV"
          printf '{"status":"UNSAFE","reason":"acquire not yet safely completed"}\n' > "$EVIDENCE/security-helpers-state.json"
          run_setup security-chain python3 tests/real-process/cp17-trial/acquire-security-reviewed.py "$stage" "$secure/ubuntu-archive-keyring.gpg"
          # Namespace policy is the original AppArmor sysctl only. No staged-path profile, setuid, privileged fallback.
          key=kernel.apparmor_restrict_unprivileged_userns
          run_setup sandbox-apparmor-before sysctl -n "$key"
          before=$(tail -n1 "$EVIDENCE/sandbox-apparmor-before.log")
          case "$before" in
            0) ;;
            1) run_setup sandbox-apparmor-set sudo -n sysctl -w "$key=0" ;;
            *) printf 'BLOCKED: unexpected AppArmor value\n'; exit 1 ;;
          esac
          run_setup sandbox-apparmor-after sysctl -n "$key"
          test "$(tail -n1 "$EVIDENCE/sandbox-apparmor-after.log")" = 0
          printf 'SETUP_COMPLETE_NOT_RUNTIME_PASS\n' > "$EVIDENCE/sandbox-setup.txt"
      - name: One StageA build/native/source-body trial under reviewed scopes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE/security-helpers-state.json" <<'SAFE'
          import json,pathlib,sys
          s=json.loads(pathlib.Path(sys.argv[1]).read_text());assert s['status']=='SAFE' and not s['active'] and not s['sticky_unsafe'] and not s['signals']
          SAFE
          bash tests/real-process/cp17-trial/run-reviewed-trial.sh
      - name: Always cleanup only this new delegated run scope
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          script=tests/real-process/wal-owner/cleanup-delegation.sh
          printf '%s  %s\n' c48fc2fd4c0920818e1f2d349a012872ea061f23067d26bd7f2a8a9206c3a35a "$script" | sha256sum --check
          python3 tests/real-process/cp17-trial/host-control-reviewed.py cleanup cgroup-cleanup 20 bash "$script"
      - name: Always remove only this trial root-owned apt scope under reserved cleanup budget
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -e "$EVIDENCE/security-helpers-state.json"; then
            python3 - "$EVIDENCE/security-helpers-state.json" <<'SAFE'
          import json,pathlib,sys
          s=json.loads(pathlib.Path(sys.argv[1]).read_text());assert s['status']=='SAFE' and not s.get('active') and not s.get('sticky_unsafe') and not s.get('signals'),'UNSAFE helpers: retain owner resources and STOP'
          SAFE
          fi
          if test -z "${APT_TRIAL_SCOPE:-}"; then exit 0; fi
          [[ "$APT_TRIAL_SCOPE" =~ ^/run/initial-owner-apt\.[A-Za-z0-9]{8}$ ]]
          python3 tests/real-process/cp17-trial/host-control-reviewed.py cleanup sandbox-cleanup 20 sudo -n rm -rf --one-file-system -- "$APT_TRIAL_SCOPE"
          test ! -e "$APT_TRIAL_SCOPE"
          rm -rf -- "$RUNNER_TEMP/security-bwrap-stage"
          rm -f -- "$RUNNER_TEMP/security-key.gpg"
      - name: Always retain bounded evidence within reserved deadline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          budget=$(python3 - "$EVIDENCE/job-clock.json" <<'LIMIT'
          import json,pathlib,sys,time
          c=json.loads(pathlib.Path(sys.argv[1]).read_text());v=min(30,int(c['deadline_monotonic']-time.monotonic()-5));assert v>0,'No export budget';print(v)
          LIMIT
          )
          if test "$budget" -lt 7; then
            short=$((budget-1)); if test "$short" -lt 1; then short=1; fi
            printf '%s\n' 'EVIDENCE_INCOMPLETE_INSUFFICIENT_FULL_EXPORT_WINDOW'
            timeout --signal=TERM --kill-after=1s "${short}s" python3 tests/real-process/cp17-trial/export-evidence.py "$EVIDENCE" --emergency-only || true
            exit 1
          fi
          primary=$((budget-5))
          if test "$primary" -lt 1; then primary=1; fi
          if timeout --signal=TERM --kill-after=1s "${primary}s" python3 tests/real-process/cp17-trial/export-evidence.py "$EVIDENCE"; then
            exit 0
          else
            code=$?
            printf '%s\n' 'EVIDENCE_INCOMPLETE_PRIMARY_EXPORT_FAILED'
            # Same overall30s allocation, five seconds reserved above.
            timeout --signal=TERM --kill-after=1s 3s python3 tests/real-process/cp17-trial/export-evidence.py "$EVIDENCE" --emergency-only || true
            exit "$code"
          fi
