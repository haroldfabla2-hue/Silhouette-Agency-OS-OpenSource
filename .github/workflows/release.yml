name: JDK21 STATIC FINGERPRINT ONLY NO PRODUCT

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact independently reviewed isolated commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  static-jdk-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Exact public standard-runner guard before any read
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          test '${{ github.event_name }}' = workflow_dispatch
          test '${{ github.ref }}' = refs/heads/preparation/jdk21-static-fingerprint-20261114
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test '${{ github.sha }}' = "$EXPECTED_HEAD"
          test '${{ github.event.repository.private }}' = false
          test '${{ runner.environment }}' = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test -n "$JAVA_HOME_21_X64"
      - name: Bounded static read in private read-only JDK mount
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/unshare
          test -x /usr/bin/mount
          test -x /usr/bin/umount
          test -x /usr/bin/python3
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin JDK_STATIC_PRIVATE_MOUNT=1 JAVA_HOME_21_X64="$JAVA_HOME_21_X64" ImageOS="${ImageOS-}" ImageVersion="${ImageVersion-}" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" /usr/bin/timeout --signal=TERM --kill-after=3s 70s /usr/bin/unshare --mount --propagation private /usr/bin/python3 - <<'STATIC_JDK'
          # Source review only. No Java or product execution; only bounded static reads.
          import hashlib,json,os,pathlib,signal,stat,subprocess,time
          start=time.monotonic();result={'status':'INCOMPLETE','scope':'STATIC_JDK21_FILES_ONLY_NOT_JVM_OR_PRODUCT_COMPATIBILITY','files':{}};mounted=False;home=None
          MAX_TOTAL=512*1024**2;MAX_FILE=256*1024**2;total=0
          
          def alarm(*unused):raise TimeoutError('static-read absolute60s')
          def digest(path):
           global total
           h=hashlib.sha256();s=path.stat();assert stat.S_ISREG(s.st_mode)and 0<s.st_size<=MAX_FILE
           with path.open('rb')as f:
            before=os.fstat(f.fileno());assert before.st_dev==s.st_dev and before.st_ino==s.st_ino
            count=0
            while True:
             b=f.read(1024**2)
             if not b:break
             count+=len(b);total+=len(b);assert count<=MAX_FILE and total<=MAX_TOTAL
             h.update(b)
            after=os.fstat(f.fileno());assert (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns)==(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns)and count==s.st_size,'file changed during hash'
           return {'sha256':h.hexdigest(),'bytes':count,'device':s.st_dev,'inode':s.st_ino}
          def command(args):
           p=subprocess.run(args,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=5,check=False)
           assert p.returncode==0 and len(p.stdout)+len(p.stderr)<=4096,'fixed mount command failed'
          try:
           signal.signal(signal.SIGALRM,alarm);signal.alarm(60)
           assert os.geteuid()==0 and os.environ.get('JDK_STATIC_PRIVATE_MOUNT')=='1'
           assert pathlib.Path('/proc/self/ns/mnt').readlink()!=pathlib.Path('/proc/1/ns/mnt').readlink(),'must be private mount namespace'
           raw=os.environ['JAVA_HOME_21_X64'];assert 0<len(raw)<256
           home=pathlib.Path(raw).resolve(strict=True)
           assert str(home).startswith('/usr/lib/jvm/')or str(home).startswith('/opt/hostedtoolcache/Java_'),'JDK21 env must resolve inside existing standard runner JDK roots'
           assert home.is_dir()and home!=pathlib.Path('/')
           command(['/usr/bin/mount','--bind',str(home),str(home)]);mounted=True
           command(['/usr/bin/mount','-o','remount,bind,ro,nodev,nosuid',str(home)])
           assert os.statvfs(home).f_flag&os.ST_RDONLY
           names=['release','bin/java','lib/modules','lib/server/libjvm.so'];paths={}
           for name in names:
            f=home/name;resolved=f.resolve(strict=True);assert resolved.is_relative_to(home),'JDKfileoutsidehome'
            assert os.statvfs(resolved).f_flag&os.ST_RDONLY
            paths[name]=resolved
           assert paths['release'].stat().st_size<=16384
           release=paths['release'].read_text();assert any(l.startswith('JAVA_VERSION="21.')for l in release.splitlines()),'selectedJDKnot21'
           for name in names:result['files'][name]=digest(paths[name])
           result.update(status='STATIC_READ_PASS_NOT_BOOTFIT',home=str(home),selection='EXACT_JAVA_HOME_21_X64_ENV_NO_SEARCH_OR_FALLBACK',mount_read_only=True,mount_namespace_private=True,total_hashed_bytes=total,image={k:os.environ.get(k)for k in ['ImageOS','ImageVersion','RUNNER_OS','RUNNER_ARCH']},os_release_sha256=hashlib.sha256(pathlib.Path('/etc/os-release').read_bytes()).hexdigest(),release_sha256=result['files']['release']['sha256'],pin={'home':str(home),'release_sha256':result['files']['release']['sha256'],'files':{name:result['files'][name]['sha256']for name in names if name!='release'}})
          except BaseException as error:
           result.update(status='FAIL',error_type=type(error).__name__,error=str(error)[:512]);raise
          finally:
           if mounted:
            try:command(['/usr/bin/umount',str(home)]);result['mount_cleanup']='UNMOUNTED_PRIVATE_BIND'
            except Exception as error:result.update(status='FAIL',mount_cleanup='FAILED_'+type(error).__name__)
           signal.alarm(0);result['seconds']=time.monotonic()-start
           body=json.dumps(result,separators=(',',':'));assert len(body.encode())<=16384
           print('JDK21_STATIC_RESULT '+body,flush=True)
           if result['status']=='FAIL':raise SystemExit(1)
          STATIC_JDK
