# INACTIVE REVIEW COPY, intended path only after a separate publication decision:
# .github/workflows/narrative-directed-once.yml
name: Directed real Narrative shutdown and recovery, partial coverage only
on:
  push:
    branches: [fix/shutdown-contracts-narrow-20261117]
    paths: [.github/workflows/narrative-directed-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: narrative-directed-pr226-once
  cancel-in-progress: false
jobs:
  directed-narrative:
    if: github.repository == 'haroldfabla2-hue/Silhouette-Agency-OS-OpenSource' && github.ref == 'refs/heads/fix/shutdown-contracts-narrow-20261117' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - id: guard
        name: Verify exact reviewed source transition before preparation
        env:
          EVENT_HEAD: ${{ github.sha }}
        run: |
          python3 -I -B -S - <<'PYGUARD'
          import hashlib,json,os,pathlib,subprocess
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          root=pathlib.Path.cwd()
          doc=json.loads((root/'tests/narrative-directed-activation/ACTIVATION.json').read_text())
          assert doc['base']=='393cb88058e317112195dab6c4df98c3e9f7e0ed'
          assert git('rev-parse','HEAD')==os.environ['EVENT_HEAD']
          assert git('show','-s','--format=%P','HEAD')==doc['base']
          assert set(git('diff','--name-only','HEAD^','HEAD').splitlines())==set(doc['changedPaths'])
          for name,wanted in doc['frozen'].items():
              p=root/name
              assert p.is_file() and not p.is_symlink()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==wanted
          PYGUARD
      - name: Preparation Node only, not product runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - id: reconstruction
        name: Reconstruct exact reviewed scratch archive without evaluating product
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=10s 240s python3 -I -B -S tests/narrative-directed-activation/prepare-reviewed.INACTIVE.py
      - id: batch
        name: One directed product batch, no automatic retry
        if: steps.reconstruction.outcome == 'success'
        run: |
          timeout --signal=TERM --kill-after=15s 160s sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C /usr/bin/python3 -I -B -S - <<'PYRUN'
          import importlib.util,pathlib
          source=pathlib.Path('tests/narrative-directed/host-adapter.INACTIVE.py').resolve()
          spec=importlib.util.spec_from_file_location('directed_host',source)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          result=module.run_candidate(repository=pathlib.Path.cwd(),
              preparation='/tmp/narrative-directed-preparation/assembled/PREPARATION.json',
              docker_archive='/tmp/narrative-directed-preparation/assembled/directed-image.docker.tar',
              expected_preparation_sha256='272cc04d6d807dc3dc60d19bdea9b898e5de458f7dab4bad708293ef38651c51',
              receipt='/tmp/narrative-directed-result.json')
          raise SystemExit(0 if result.get('result')=='PASS_DIRECTED_NARRATIVE_ONLY' else 1)
          PYRUN
      - id: evidence
        name: Export selected bounded technical evidence, never raw fixture logs
        if: always() && steps.guard.outcome == 'success'
        run: timeout --signal=TERM --kill-after=5s 30s sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C /usr/bin/python3 -I -B -S tests/narrative-directed-activation/export-selected.INACTIVE.py
      - name: Preserve selected receipts for independent review
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: directed-narrative-partial-selected-evidence
          path: /tmp/narrative-directed-evidence/*.json
          if-no-files-found: error
          retention-days: 2
