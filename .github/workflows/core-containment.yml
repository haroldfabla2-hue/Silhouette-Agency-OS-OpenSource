name: Reviewed core containment only

# No dispatch/default-branch assumption, no auto-generated execution anchor.
# The first source publication has no anchor file and cannot trigger this job.
# A later reviewed single-parent transition must add the frozen anchor file.
# A duplicated delivery of that exact event can still create another first run;
# this guard does not claim global at-most-once delivery.
on:
  pull_request:
    branches: [main, develop, fix/memory-p0-transactional-20260929]
    paths:
      - tests/hydration-gates-capsule/CORE-EXECUTION-ANCHOR.json
permissions:
  contents: read
  actions: read
concurrency:
  group: core-containment-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  core-only:
    # Fixed reviewed transition, never regenerated by metadata jobs.
    if: false # Attempt finished STOP; retained source is inactive.
    # Previous reviewed predicate: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.repository == 'haroldfabla2-hue/Silhouette-Agency-OS-OpenSource' && github.event.pull_request.number == 226 && github.event.pull_request.head.repo.full_name == 'haroldfabla2-hue/Silhouette-Agency-OS-OpenSource' && github.head_ref == 'fix/shutdown-contracts-narrow-20261117' && github.event.before == 'd0a6a636fe0b0311ca2349f025075f0ce42847c6' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Verify the actual reviewed single-parent transition before install
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I -B -S - <<'PYGATE'
          import os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['EXPECTED_HEAD'],'EVENT_HEAD_MISMATCH'
          assert git('show','-s','--format=%P','HEAD')=='d0a6a636fe0b0311ca2349f025075f0ce42847c6','NOT_REVIEWED_SINGLE_PARENT'
          expected={'tests/hydration-gates-capsule/CORE-EXECUTION-ANCHOR.json','tests/hydration-gates-capsule/test-core-wiring-pure.py','.github/workflows/core-containment.yml'}
          actual=set(git('diff','--name-only','HEAD^','HEAD').splitlines())
          assert actual==expected,'UNREVIEWED_CUT_FILE_SET'
          print('FIXED_CORE_CUT_IDENTITY_OK')
          PYGATE
      - name: Existing namespace tools, no security policy changes
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap iproute2 util-linux libseccomp2
      - name: Verify externally frozen identities and run reviewed core only
        env:
          GH_TOKEN: ${{ github.token }}
        run: env -i PATH=/usr/bin:/bin LC_ALL=C GH_TOKEN="$GH_TOKEN" /usr/bin/python3 -I -B -S tests/hydration-gates-capsule/execute-reviewed-core.py
      - name: Preserve selected bounded receipts, never control config or bus paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-containment-selected-receipts
          path: |
            /tmp/hg-core-evidence/suite.json
            /tmp/hg-core-evidence/*/controller-receipt.json
            /tmp/hg-core-evidence/*/controller-failure.json
            /tmp/hg-core-evidence/*/cleanup-unknown.json
          if-no-files-found: ignore
          retention-days: 2
