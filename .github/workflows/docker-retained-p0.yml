# INACTIVE REVIEW COPY. Intended path only after separate approval:
# .github/workflows/docker-retained-p0.yml
name: Retained-domain fixed gate preparation, no application release
on:
  push:
    branches: [fix/shutdown-contracts-narrow-20261117]
    paths: [.github/workflows/docker-retained-p0.yml]
permissions:
  contents: read
jobs:
  preparation:
    if: github.repository == 'haroldfabla2-hue/Silhouette-Agency-OS-OpenSource' && github.ref == 'refs/heads/fix/shutdown-contracts-narrow-20261117' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - id: guard
        name: Verify exact retained-domain source transition
        env:
          ACTUAL_HEAD: ${{ github.sha }}
        run: |
          python3 -I -B -S - <<'PYGATE'
          import os,subprocess,hashlib,pathlib
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['ACTUAL_HEAD']
          assert git('show','-s','--format=%P','HEAD')=='74101c05adb2f5ca6819d0e72fef42c75b132c69'
          assert set(git('diff','--name-only','HEAD^','HEAD').splitlines())=={
              '.github/workflows/docker-retained-p0.yml',
              'scripts/containment/docker-p0.INACTIVE.py',
              'scripts/containment/p0-retained-domain.INACTIVE.py',
              'scripts/containment/p0-rooted-paths.INACTIVE.py'}
          frozen={'scripts/containment/docker-p0.INACTIVE.py': '374ac478ea75b707d9f2e27409b9a787c4d8f2876cbaf980da351a9198bb7754', 'scripts/containment/p0-retained-domain.INACTIVE.py': '9ae98be1fb3e57f025cf77f1c362458ba2912b4cc971ae48d8a359fc9e2e293d', 'scripts/containment/p0-rooted-paths.INACTIVE.py': '9e739b284c26c97f3cbd3cce18aa14d9bdf51df4920974731b9fecd20e618d7b', 'scripts/containment/node-runtime-closure.INACTIVE.json': 'e4e141fccb90374fdfa810c22bbc6efa474100cebf2d1c701576f26f122c6ac2'}
          for name,digest in frozen.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest
          PYGATE
      - name: Acquire fixed runtime and inspect retained fixed gate
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C /usr/bin/python3 -I -B -S - <<'PYPREP'
          import importlib.util,pathlib
          source=pathlib.Path('scripts/containment/docker-p0.INACTIVE.py').resolve()
          spec=importlib.util.spec_from_file_location('retained_preparation',source)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          raise SystemExit(module.preparation_candidate(receipt='/tmp/p0-preparation-receipt.json',acquire_fixed_image=True))
          PYPREP
      - id: evidence
        name: Export bounded technical evidence
        if: always() && steps.guard.outcome == 'success'
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C /usr/bin/python3 -I -B -S - <<'PYEXPORT'
          import importlib.util,pathlib
          source=pathlib.Path('scripts/containment/docker-p0.INACTIVE.py').resolve()
          spec=importlib.util.spec_from_file_location('retained_export',source)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          module.export_sanitized('/tmp/p0-sanitized-receipt.json')
          PYEXPORT
      - name: Preserve selected technical evidence
        if: always() && steps.guard.outcome == 'success' && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: retained-preparation-technical-evidence
          path: /tmp/p0-sanitized-receipt.json
          if-no-files-found: error
          retention-days: 2
