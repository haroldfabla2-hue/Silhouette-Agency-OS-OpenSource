# LOCAL REVIEW PROPOSAL ONLY. Publishing/execution requires a separate explicit gate.
name: Isolated Node and tsx resolver routing
on:
  push:
    branches:
      - validation/resolver-routing-825e905-20261116
permissions:
  contents: read
concurrency:
  group: resolver-routing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  routing:
    if: ${{ github.run_attempt == 1 && github.event.repository.private == false && github.ref == 'refs/heads/validation/resolver-routing-825e905-20261116' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stage: [NODE, TSX]
    env:
      ROUTING_STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: transport
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 825e9050407fe0cd7ce4bcafccccb03e7e0dbd53
          path: candidate
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6b49bc2a7fadcd87759cd0c1d534c832194b1572
          path: baseline
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact public source and reviewed transport
        env:
          ACTUAL: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          test "$REPOSITORY" = haroldfabla2-hue/Silhouette-Agency-OS-OpenSource
          test "$(git -C transport rev-parse HEAD)" = "$ACTUAL"
          test -z "$(git -C transport status --porcelain)"
          test "$(git -C candidate rev-parse HEAD)" = 825e9050407fe0cd7ce4bcafccccb03e7e0dbd53
          test "$(git -C baseline rev-parse HEAD)" = 6b49bc2a7fadcd87759cd0c1d534c832194b1572
          test -x /usr/bin/docker
          test -S /var/run/docker.sock
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('transport/.github/resolver-routing')
          assert hashlib.sha256((root/'host-pins.json').read_bytes()).hexdigest()=='6919b9f5a8b5c0a59cc1c9b433f26a777a2437e455bf8c7b674f463708d5adf2'
          pins=json.loads((root/'host-pins.json').read_text())
          for path,digest in pins['files'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==digest
          PY
      - name: Prepare inert source and stage-specific tooling without imports
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=2s 270s env -i PATH=/usr/bin:/bin HOME=/nonexistent \
            python3 transport/.github/resolver-routing/prepare-host.py "$PWD" "$RUNNER_TEMP/routing-result" "$ROUTING_STAGE" \
            >"$RUNNER_TEMP/routing-prepare.stdout" 2>"$RUNNER_TEMP/routing-prepare.stderr"
      - name: One fresh canary-gated resolver-only stage
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin HOME=/nonexistent GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            python3 transport/.github/resolver-routing/controller.py "$PWD/transport" "$RUNNER_TEMP/routing-result" "$ROUTING_STAGE" \
            >"$RUNNER_TEMP/routing-controller.stdout" 2>"$RUNNER_TEMP/routing-controller.stderr"
      - name: Natural outer cleanup verification
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/routing-result"
          suffix=$(printf '%s' "$ROUTING_STAGE" | tr '[:upper:]_' '[:lower:]-')
          name="routing-${GITHUB_RUN_ID}-${suffix}"
          if ! remaining=$(/usr/bin/docker --host unix:///var/run/docker.sock ps -a --filter "name=^/${name}$" --format '{{.ID}}' 2>"$RUNNER_TEMP/routing-remaining.stderr"); then
            printf 'outer_cleanup_unverifiable\n' > "$RUNNER_TEMP/routing-result/outer-cleanup.txt"
            exit 1
          fi
          found=0
          if test -n "$remaining"; then
            found=1
            /usr/bin/docker --host unix:///var/run/docker.sock kill "$name" >"$RUNNER_TEMP/routing-kill.stdout" 2>&1 || true
            /usr/bin/docker --host unix:///var/run/docker.sock wait "$name" >"$RUNNER_TEMP/routing-wait.stdout" 2>&1 || true
            /usr/bin/docker --host unix:///var/run/docker.sock rm -f "$name" >"$RUNNER_TEMP/routing-remove.stdout" 2>&1 || true
          fi
          printf 'outer_cleanup_forced=%s\n' "$found" > "$RUNNER_TEMP/routing-result/outer-cleanup.txt"
          test "$found" = 0
      - name: Project and scan schema-whitelisted safe routing receipts
        if: always()
        run: |
          env -i PATH=/usr/bin:/bin HOME=/nonexistent \
            python3 transport/.github/resolver-routing/emit.py "$PWD/transport" "$RUNNER_TEMP/routing-result" "$ROUTING_STAGE"
      - name: Upload only projected routing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routing-${{ matrix.stage }}-${{ github.run_id }}
          path: ${{ runner.temp }}/routing-result/safe-routing/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false
      - name: Remove disposable source/tooling and raw receipts
        if: always()
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          rm -rf -- "$RUNNER_TEMP/routing-result"
          rm -f -- "$RUNNER_TEMP"/routing-*.stdout "$RUNNER_TEMP"/routing-*.stderr
