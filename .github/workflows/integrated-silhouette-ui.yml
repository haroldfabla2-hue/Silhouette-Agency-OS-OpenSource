name: MANUAL INTEGRATED SILHOUETTE UI - PROVIDERS OFF - ROOT INCOMPLETE
on:
  push:
    branches:
      - preparation/sqlite-static-typecheck-db201993-4054-20261114
    paths:
      - .github/workflows/integrated-silhouette-ui.yml
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed integrated test source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  integrated-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Public standard-hosted zero-charge compute guard
        shell: bash
        env:
          PRIVATE: ${{ github.event.repository.private }}
          EXPECTED_HEAD: ${{ inputs.expected_head || github.sha }}
          ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push) test "${{ github.event.before }}" = fbeebf507da7dd1ccf79e568ece67e32e44e1606 ;;
            workflow_dispatch) test -n "${{ inputs.expected_head }}" ;;
            *) exit 96 ;;
          esac
          test "$PRIVATE" = false
          test "$ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = haroldfabla2-hue/Silhouette-Agency-OS-OpenSource
          test "$GITHUB_REF" = refs/heads/preparation/sqlite-static-typecheck-db201993-4054-20261114
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact one-shot push lineage and path identity before execution
        shell: bash
        run: |
          set -euo pipefail
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$(git rev-parse HEAD^)" = fbeebf507da7dd1ccf79e568ece67e32e44e1606
            test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
            git diff-tree --no-commit-id --name-only -r HEAD | sort > "$RUNNER_TEMP/integrated-actual-paths"
            printf '%s\n' .github/workflows/integrated-silhouette-ui.yml tests/integrated-ui-trial/CONTINUUM-COMPOSITION-REVIEW.md tests/integrated-ui-trial/MANIFEST.json tests/integrated-ui-trial/continuum-composition.json tests/integrated-ui-trial/continuum-overlay/server/index.ts tests/integrated-ui-trial/continuum-overlay/services/consciousnessEngine.ts tests/integrated-ui-trial/continuum-overlay/services/continuumMemory.ts tests/integrated-ui-trial/continuum-overlay/services/dreamerService.ts tests/integrated-ui-trial/continuum-overlay/services/introspectionEngine.ts tests/integrated-ui-trial/continuum-overlay/services/lifecycle/continuumDreamerNotification.ts tests/integrated-ui-trial/continuum-overlay/services/lifecycle/finiteContinuumCheckpoints.ts tests/integrated-ui-trial/continuum-overlay/services/lifecycle/retainedFailureCategories.ts tests/integrated-ui-trial/continuum-overlay/services/lifecycle/runtimeStopBindings.ts tests/integrated-ui-trial/continuum-overlay/tests/lifecycle/continuum-notification-boundary.mts tests/integrated-ui-trial/continuum-overlay/tests/lifecycle/continuum-original-integration.mts tests/integrated-ui-trial/continuum-receipt-schema.py tests/integrated-ui-trial/continuum-validation.py tests/integrated-ui-trial/hosted-orchestrator.py tests/integrated-ui-trial/integrated-hosted.yml tests/integrated-ui-trial/namespace-entry.py tests/integrated-ui-trial/packet.sha256 tests/integrated-ui-trial/return-evidence.py tests/integrated-ui-trial/supervisor.py | sort > "$RUNNER_TEMP/integrated-expected-paths"
            diff -u "$RUNNER_TEMP/integrated-expected-paths" "$RUNNER_TEMP/integrated-actual-paths"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Exact packet verification and bounded integration attempt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head || github.sha }}
          PRIVATE: ${{ github.event.repository.private }}
          ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          cd tests/integrated-ui-trial
          sha256sum --check packet.sha256
          python3 hosted-orchestrator.py
      - name: Always contain only this run's tagged phase cgroups
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env GITHUB_RUN_ID="$GITHUB_RUN_ID" RUNNER_TEMP="$RUNNER_TEMP" python3 tests/integrated-ui-trial/cleanup-hosted.py
      - name: Return bounded test evidence in job log, no artifact or cache storage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd tests/integrated-ui-trial
          sudo -n env RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 return-evidence.py
