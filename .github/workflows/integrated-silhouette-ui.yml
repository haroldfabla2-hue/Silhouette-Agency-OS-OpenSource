# EXACT PROPOSAL ONLY, not yet published or activated.
# Branch-only replacement at the EXISTING registered integrated workflow path.
# No push trigger. One separate manual dispatch requires exact reviewed head.
name: SOURCE PROPOSAL DOCKER QUALIFICATION THEN SAME SCOPED DRIVER
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed single-child source publication commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-helper-validation:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Exact manual event public standard hosted and branch guard
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PRIVATE: ${{ github.event.repository.private }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$PRIVATE" = false
          test "$RUNNER_KIND" = github-hosted
          test "$GITHUB_REPOSITORY" = haroldfabla2-hue/Silhouette-Agency-OS-OpenSource
          test "$GITHUB_REF" = refs/heads/preparation/sqlite-static-typecheck-db201993-4054-20261114
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Exact single-child lineage changed-path allowlist and complete source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5c64ee5a7308934a5bedb271c9045015f0784b12
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('tests/product-docker-validation')
          manifest=root/'MANIFEST.json'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='2937d4956c73980e5ae2957dbfa226998c80189cb5559c7ccd03028749ce4b9f'
          expected={'.github/workflows/integrated-silhouette-ui.yml', 'tests/product-docker-validation/host-validation.py', 'tests/product-docker-validation/cleanup-envelope.py', 'tests/product-docker-validation/finite-export.py', 'tests/product-docker-validation/enforcement.py', 'tests/product-docker-validation/finite_projection.py', 'tests/product-docker-validation/MANIFEST.json', 'tests/product-docker-validation/host-envelope.py', 'tests/product-docker-validation/REVIEW.md', 'tests/product-docker-validation/qualification.cjs', 'tests/product-docker-validation/driver/validate.cjs'}
          actual=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert actual==expected
          for folder,digest,count in [(root,'2937d4956c73980e5ae2957dbfa226998c80189cb5559c7ccd03028749ce4b9f',9),(Path('tests/product-source-validation'),'ad8f28f8c1e4cc1437bc44dd2199b38d929b10141aac71ef6dc3028c99275c2c',3434)]:
              manifest=folder/'MANIFEST.json';assert hashlib.sha256(manifest.read_bytes()).hexdigest()==digest
              rows=json.loads(manifest.read_text())['files'];assert len(rows)==count
              for r in rows:
                  p=folder/r['path'];assert p.is_file()and not p.is_symlink()
                  b=p.read_bytes();assert len(b)==r['bytes']and hashlib.sha256(b).hexdigest()==r['sha256']
          PYVERIFY
      - name: Exact reviewed source gate and bounded isolated helper scope
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          DOCKER_SOURCE_MANIFEST_SHA256: 2937d4956c73980e5ae2957dbfa226998c80189cb5559c7ccd03028749ce4b9f
        run: python3 tests/product-docker-validation/host-validation.py
      # No artifact upload, cache, provider, browser, native-store or public raw
      # runtime export. Fixed export and independent tagged cleanup follow.
      - name: Independent exact-tag cleanup
        if: always()
        run: env GITHUB_RUN_ID="$GITHUB_RUN_ID" RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 tests/product-docker-validation/cleanup-envelope.py
      - name: Fixed scoped evidence only, never raw source or diagnostics
        if: always()
        run: python3 tests/product-docker-validation/finite-export.py
