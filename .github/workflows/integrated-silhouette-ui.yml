# SOURCE PROPOSAL ONLY. No push/PR/schedule trigger; separate activation admission required.
name: Manual current product Vitest on one disposable public VM
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact independently reviewed workflow publication commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  current-product-vitest:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refuse wrong event audience runner branch or head
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PRIVATE: ${{ github.event.repository.private }}
          GH_TOKEN: ${{ github.token }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$PRIVATE" = false
          test "$RUNNER_KIND" = github-hosted
          test "$GITHUB_REPOSITORY" = haroldfabla2-hue/Silhouette-Agency-OS-OpenSource
          test "$GITHUB_REF" = refs/heads/validation/mcp-ingress-types-6b49-20261115
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          # Read this job's actual controller start, not a later step's clock.
          python3 - <<'PY'
          import os,json,urllib.request,datetime,pathlib
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/attempts/'+os.environ['GITHUB_RUN_ATTEMPT']+'/jobs?per_page=100'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=15) as response: body=json.load(response)
          jobs=[j for j in body['jobs'] if j['name']=='current-product-vitest' and j['status']=='in_progress']
          assert len(jobs)==1 and body['total_count']==1
          start=int(datetime.datetime.fromisoformat(jobs[0]['started_at'].replace('Z','+00:00')).timestamp())
          pathlib.Path(os.environ['RUNNER_TEMP'],'silhouette-session-job-start').write_text(str(start))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/integrated-silhouette-ui.yml
            /tests/genuine-vitest-session/
            /tests/integrated-ui-trial/archive-member-normalizations.json
            /tests/integrated-ui-trial/libsignal-packed-files.json
            /tests/integrated-ui-trial/native-provenance/better-sqlite3-v12.5.0-node-v127-linux-x64.tar.gz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Existing genuine Vitest route only, bounded session and cleanup
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 559afe6310666019f25b99effd461202bdd9b190
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          python3 - <<'PY'
          import subprocess
          expected={'tests/genuine-vitest-session/main-mcp-ingress-typecheck/server/app.ts', 'tests/genuine-vitest-session/SOURCE-SESSIONS.json', 'tests/genuine-vitest-session/main-mcp-ingress-typecheck/server/index.ts', 'tests/genuine-vitest-session/main-mcp-ingress-typecheck/server/mcp/mcpServer.ts', 'tests/genuine-vitest-session/session.sh', '.github/workflows/integrated-silhouette-ui.yml', 'tests/genuine-vitest-session/ingress-source-shape.py'}
          actual=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert actual==expected,'EXACT_REVIEWED_LEARNING_VALIDATION_INTEGRATION_REQUIRED'
          PY
          timeout --signal=TERM --kill-after=5s 75s sudo /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin SILHOUETTE_FRESH_PUBLIC_GITHUB_VM=yes /bin/bash "$GITHUB_WORKSPACE/tests/genuine-vitest-session/setup-bwrap.sh" setup "$EXPECTED_HEAD" "$GITHUB_RUN_ID"
          elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/silhouette-session-job-start") ))
          test "$elapsed" -ge 0
          test "$elapsed" -le 150
          nodebin=$(readlink -f "$(command -v node)")
          safepath="$(dirname "$nodebin"):/usr/sbin:/usr/bin:/sbin:/bin"
          # 850s coordinator +120s cleanup +<=150s setup leaves margin inside20min.
          sudo systemctl set-property --runtime silhouette-vitest.slice MemoryMax=10G MemorySwapMax=0 CPUQuota=200% TasksMax=384
          timeout --signal=TERM --kill-after=5s 860s sudo /usr/bin/env -i PATH="$safepath" \
            /usr/bin/systemd-run --quiet --pipe --wait --unit=silhouette-vitest-coordinator --slice=silhouette-vitest.slice --service-type=exec \
            -p MemoryMax=10G -p MemorySwapMax=0 -p CPUQuota=200% -p TasksMax=384 \
            -p RuntimeMaxSec=850 -p TimeoutStopSec=5 -p KillMode=control-group \
            -p StandardError=null \
            /usr/bin/env -i PATH="$safepath" /bin/bash "$GITHUB_WORKSPACE/tests/genuine-vitest-session/session.sh" "$GITHUB_WORKSPACE" "$EXPECTED_HEAD" "$GITHUB_RUN_ID"
      - name: Final cleanup and finite public-fixture summary only
        if: always()
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 120s sudo /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/systemd-run --quiet --pipe --wait --unit=silhouette-vitest-final-cleanup --slice=silhouette-vitest.slice --service-type=exec \
            -p MemoryMax=512M -p MemorySwapMax=0 -p CPUQuota=50% -p TasksMax=64 \
            -p RuntimeMaxSec=110 -p TimeoutStopSec=5 -p KillMode=control-group \
            -p StandardError=null \
            /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /bin/bash "$GITHUB_WORKSPACE/tests/genuine-vitest-session/cleanup.sh" "$EXPECTED_HEAD" "$GITHUB_RUN_ID"
      - name: Restore only owned bwrap setup
        if: always()
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          timeout --signal=TERM --kill-after=5s 30s sudo /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /bin/bash "$GITHUB_WORKSPACE/tests/genuine-vitest-session/setup-bwrap.sh" cleanup "$EXPECTED_HEAD" "$GITHUB_RUN_ID"
# No artifact/cache upload, browser/model/provider acquisition, matrix or rerun.
