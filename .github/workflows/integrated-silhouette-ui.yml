# EXACT PROPOSAL ONLY, not yet published or activated.
# Branch-only replacement at the EXISTING registered integrated workflow path.
# No push trigger. One separate manual dispatch requires exact reviewed head.
name: SCOPED PRODUCT COMPILER AND REAL FILESYSTEM - NO PRODUCT ACCEPTANCE
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed single-child source publication commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-helper-validation:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Exact manual event public standard hosted and branch guard
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          PRIVATE: ${{ github.event.repository.private }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$PRIVATE" = false
          test "$RUNNER_KIND" = github-hosted
          test "$GITHUB_REPOSITORY" = haroldfabla2-hue/Silhouette-Agency-OS-OpenSource
          test "$GITHUB_REF" = refs/heads/preparation/sqlite-static-typecheck-db201993-4054-20261114
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - name: Exact single-child lineage changed-path allowlist and complete source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5609910e7501df19aa5dae13732c98668d1c17fb
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('tests/product-source-validation')
          manifest=root/'MANIFEST.json'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='ef8e3c064981196921e0ae4c5eac59a0a560dc0a4e307500924dc4b4bc2265ca'
          rows=json.loads(manifest.read_text())['files']
          expected={str(root/p)for p in ['launcher/supervisor.py', 'launcher/identity-entry.py', 'launcher/namespace-entry.py', 'driver/validate.cjs', 'finite_projection.py', 'finite-export.py', 'supervisor_projection.py', 'MANIFEST.json']}|{'.github/workflows/integrated-silhouette-ui.yml'}
          actual=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert actual==expected
          assert len(rows)==3432
          for r in rows:
              p=root/r['path'];assert p.is_file()and not p.is_symlink()
              b=p.read_bytes();assert len(b)==r['bytes']and hashlib.sha256(b).hexdigest()==r['sha256']
          PYVERIFY
      - name: Exact reviewed source gate and bounded isolated helper scope
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 tests/product-source-validation/host-validation.py
      # No artifact upload, cache, provider, browser, native-store or public raw
      # runtime export. Fixed export and independent tagged cleanup follow.
      - name: Independent exact-tag cleanup
        if: always()
        run: sudo -n env GITHUB_RUN_ID="$GITHUB_RUN_ID" RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 tests/product-source-validation/launcher/cleanup-hosted.py
      - name: Fixed scoped evidence only, never raw source or diagnostics
        if: always()
        run: python3 tests/product-source-validation/finite-export.py
