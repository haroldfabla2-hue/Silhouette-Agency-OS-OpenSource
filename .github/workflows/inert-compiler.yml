# LOCAL REVIEW PROPOSAL. Not authorized to publish or execute.
name: Inert three-contract compiler comparison
on:
  push:
    branches:
      - validation/lifecycle-owned-loader-status-2e4036b6-20261116
permissions:
  contents: read
concurrency:
  group: inert-compiler-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: ${{ github.run_attempt == 1 && github.event.repository.private == false && github.ref == 'refs/heads/validation/lifecycle-owned-loader-status-2e4036b6-20261116' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6b49bc2a7fadcd87759cd0c1d534c832194b1572
          path: baseline
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Label exact source and Docker prerequisites
        env:
          ACTUAL: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/inert-result/safe-diagnostics"
          guard() {
            label=$1; shift
            if "$@"; then rc=0; else rc=$?; fi
            printf '%s rc=%s\n' "$label" "$rc" >> "$RUNNER_TEMP/inert-result/safe-diagnostics/preflight.txt"
            printf 'PREFLIGHT %s rc=%s\n' "$label" "$rc"
            test "$rc" = 0
          }
          guard repository test "$REPOSITORY" = haroldfabla2-hue/Silhouette-Agency-OS-OpenSource
          guard commit_format bash -c '[[ "$ACTUAL" =~ ^[0-9a-f]{40}$ ]]'
          guard candidate_commit test "$(git -C candidate rev-parse HEAD)" = "$ACTUAL"
          guard baseline_commit test "$(git -C baseline rev-parse HEAD)" = 6b49bc2a7fadcd87759cd0c1d534c832194b1572
          guard candidate_clean test -z "$(git -C candidate status --porcelain)"
          guard docker_cli test -x /usr/bin/docker
          guard local_daemon_socket test -S /var/run/docker.sock
          guard cgroup_v2 test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
      - name: Prepare exact inert source and dependencies
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=2s 270s env -i PATH=/usr/bin:/bin HOME=/nonexistent \
            python3 candidate/.github/inert-compiler/prepare.py "$PWD" "$RUNNER_TEMP/inert-result" \
            >"$RUNNER_TEMP/inert-result/preparation.stdout" 2>"$RUNNER_TEMP/inert-result/preparation.stderr"
      - name: Three sequential Docker canary-gated checker contracts
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin HOME=/nonexistent GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            python3 candidate/.github/inert-compiler/docker-controller.py "$PWD" "$RUNNER_TEMP/inert-result" \
            >"$RUNNER_TEMP/inert-result/controller.stdout" 2>"$RUNNER_TEMP/inert-result/controller.stderr"
      - name: Verify no named container remains
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inert-result/safe-diagnostics"
          found=0
          for side in baseline candidate candidate-aligned; do
            name="inert-ts-${GITHUB_RUN_ID}-${side}"
            if ! remaining=$(/usr/bin/docker --host unix:///var/run/docker.sock ps -a --filter "name=^/${name}$" --format '{{.ID}}' 2>"$RUNNER_TEMP/inert-result/remaining-$side.stderr"); then
              printf 'outer_cleanup_unverifiable\n' > "$RUNNER_TEMP/inert-result/safe-diagnostics/cleanup.txt"
              exit 1
            fi
            if test -n "$remaining"; then
              found=1
              /usr/bin/docker --host unix:///var/run/docker.sock kill "$name" >"$RUNNER_TEMP/inert-result/kill-$side.stdout" 2>&1 || true
              /usr/bin/docker --host unix:///var/run/docker.sock wait "$name" >"$RUNNER_TEMP/inert-result/wait-$side.stdout" 2>&1 || true
              /usr/bin/docker --host unix:///var/run/docker.sock rm -f "$name" >"$RUNNER_TEMP/inert-result/remove-$side.stdout" 2>&1 || true
            fi
          done
          printf 'outer_cleanup_forced=%s\n' "$found" > "$RUNNER_TEMP/inert-result/safe-diagnostics/cleanup.txt"
          test "$found" = 0
      - name: Scan and prepare only safe source diagnostics
        if: always()
        run: |
          env -i PATH=/usr/bin:/bin HOME=/nonexistent \
            python3 candidate/.github/inert-compiler/emit.py "$RUNNER_TEMP/inert-result"
      - name: Upload safe diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inert-compiler-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/inert-result/safe-diagnostics/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false
      - name: Remove disposable inputs and raw receipts
        if: always()
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          rm -rf -- "$RUNNER_TEMP/inert-result"
