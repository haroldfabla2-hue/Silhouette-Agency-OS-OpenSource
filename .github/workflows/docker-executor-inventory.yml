# ACTIVATION CANDIDATE ONLY. Not installed under .github/workflows yet.
# Proposed destination: .github/workflows/docker-executor-inventory.yml
# Only existing-executor reads. No checkout or container/payload operation.
name: Read-only existing Docker executor inventory
on:
  push:
    branches: [fix/shutdown-contracts-narrow-20261117]
    paths: [.github/workflows/docker-executor-inventory.yml]
permissions: {}
jobs:
  inventory:
    if: github.repository == 'haroldfabla2-hue/Silhouette-Agency-OS-OpenSource' && github.ref == 'refs/heads/fix/shutdown-contracts-narrow-20261117' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read existing executor metadata only
        shell: bash
        run: |
          env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C /usr/bin/python3 -I -B -S - <<'PYINVENTORY'
          import hashlib,json,os,pathlib,selectors,shutil,signal,subprocess,time
          # The 30s aggregate deadline covers metadata commands only. Hashing,
          # host-file reads and formatting are bounded by the 2-minute job, not
          # falsely attributed to that command budget.
          started=time.monotonic()
          image='node@sha256:650d460b4e6b02411caa0e563838f07fafc9792314d5091859d837d8b070712b'
          result={'kind':'READ_ONLY_EXECUTOR_INVENTORY','payloadReleased':False,'containerCreated':False,'imageRequested':image}
          def command(argv,structured=False):
              seconds=min(5,30-(time.monotonic()-started))
              if seconds<=0:return {'state':'UNVERIFIED','error':'INVENTORY_DEADLINE'}
              child=None;failure=None;code=None;data=bytearray();total=0
              try:
                  child=subprocess.Popen(argv,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True,env={'PATH':'/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','LC_ALL':'C'})
                  end=time.monotonic()+seconds
                  with selectors.DefaultSelector() as poll:
                      for stream in (child.stdout,child.stderr):
                          os.set_blocking(stream.fileno(),False);poll.register(stream,selectors.EVENT_READ)
                      while poll.get_map():
                          remaining=end-time.monotonic()
                          if remaining<=0:failure='READ_TIMEOUT';break
                          for key,_ in poll.select(min(remaining,0.1)):
                              chunk=os.read(key.fileobj.fileno(),4096)
                              if not chunk:poll.unregister(key.fileobj);continue
                              total+=len(chunk)
                              if total>65536:failure='READ_OUTPUT_LIMIT';break
                              if key.fileobj is child.stdout:data.extend(chunk)
                          if failure:break
                  if failure:return {'state':'UNVERIFIED','error':failure}
                  code=child.wait(timeout=max(0.01,end-time.monotonic()))
                  if code:return {'state':'UNVERIFIED','error':'READ_EXIT_NONZERO','exit':code}
                  value=data.decode('utf-8','strict')
                  return {'state':'OBSERVED','value':json.loads(value) if structured else value.strip()}
              except subprocess.TimeoutExpired:return {'state':'UNVERIFIED','error':'READ_TIMEOUT'}
              except Exception:return {'state':'UNVERIFIED','error':'READ_FAILED'}
              finally:
                  if child:
                      # Signal only while the direct child remains unreaped and
                      # its PID/PGID identity is still reserved. Never signal a
                      # released numeric group after successful wait(). This is
                      # bounded read-client handling, not P0 cleanup evidence.
                      if code is None:
                          try:os.killpg(child.pid,signal.SIGKILL)
                          except ProcessLookupError:pass
                          try:child.wait(timeout=1)
                          except subprocess.TimeoutExpired:pass
                      child.stdout.close();child.stderr.close()
          def selected(observation,keys):
              if observation.get('state')!='OBSERVED':return observation
              value=observation.get('value')
              if not isinstance(value,dict):return {'state':'UNVERIFIED','error':'UNEXPECTED_SCHEMA'}
              return {'state':'OBSERVED','value':{key:value[key] for key in keys if key in value}}
          docker=shutil.which('docker')
          result['dockerClientPresent']=bool(docker)
          if docker:
              v=command([docker,'version','--format','{{json .}}'],True)
              if v.get('state')=='OBSERVED' and isinstance(v.get('value'),dict):
                  root=v['value'];server=root.get('Server') or {};client=root.get('Client') or {}
                  result['version']={'state':'OBSERVED','client':{k:client[k] for k in ('Version','ApiVersion','GitCommit','Os','Arch') if k in client},'server':{k:server[k] for k in ('Version','ApiVersion','MinAPIVersion','GitCommit','Os','Arch') if k in server},'components':[{'name':c.get('Name'),'version':c.get('Version')} for c in server.get('Components',[]) if c.get('Name') in ('Engine','containerd','runc','docker-init')]}
              else:result['version']={'state':'UNVERIFIED','error':v.get('error','UNEXPECTED_SCHEMA')}
              fmt='{"ServerVersion":{{json .ServerVersion}},"OSType":{{json .OSType}},"Architecture":{{json .Architecture}},"CgroupVersion":{{json .CgroupVersion}},"CgroupDriver":{{json .CgroupDriver}},"DefaultRuntime":{{json .DefaultRuntime}},"Runtimes":{{json .Runtimes}}}'
              info=command([docker,'info','--format',fmt],True)
              result['info']=selected(info,('ServerVersion','OSType','Architecture','CgroupVersion','CgroupDriver','DefaultRuntime'))
              if info.get('state')=='OBSERVED' and isinstance(info.get('value'),dict):
                  # Names only. Runtime args/path and warnings never published.
                  result['runtimeNames']=sorted((info['value'].get('Runtimes') or {}).keys())
              result['localImage']=command([docker,'image','inspect','--format','{"Id":{{json .Id}},"RepoDigests":{{json .RepoDigests}},"Os":{{json .Os}},"Architecture":{{json .Architecture}}}',image],True)
              # A successful exact digest-filtered listing can distinguish no image
              # from daemon/read errors. No image pull or registry call occurs.
              result['localImageMatches']=command([docker,'image','ls','--no-trunc','--quiet','--filter','reference='+image])
          for name in ('runc','containerd'):
              binary=shutil.which(name);entry={'pathBinaryPresent':bool(binary),'pathBinaryIsNotDaemonBinding':True}
              if binary:
                  ver=command([binary,'--version'])
                  if ver.get('state')=='OBSERVED':
                      # Emit a version token only, no arbitrary version banner.
                      import re
                      match=re.search(r'\b\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.]+)?\b',ver['value'])
                      entry['version']=match.group(0) if match else None
                  else:entry['versionRead']=ver
                  try:
                      with open(binary,'rb') as stream:entry['binarySha256']=hashlib.file_digest(stream,'sha256').hexdigest()
                  except Exception:entry['hashState']='UNVERIFIED'
              result[name]=entry
          cpu=pathlib.Path('/sys/devices/system/cpu')
          result['thermalThrottlePathsPresent']=sorted(str(p) for p in cpu.glob('cpu[0-9]*/thermal_throttle') if p.is_dir()) if cpu.is_dir() else None
          try:result['possibleCPUs']=pathlib.Path('/sys/devices/system/cpu/possible').read_text().strip()
          except Exception:result['possibleCPUsState']='UNVERIFIED'
          result['notProved']=['daemon binding to PATH runtime','effective OCI defaults','actual submounts/RO flags','live cgroup/ownership','gate/runtime fit','cleanup empty-before-disappearance']
          result['elapsedSeconds']=round(time.monotonic()-started,3)
          result['greenMeansInventoryFinishedOnly']=True
          print(json.dumps(result,sort_keys=True,separators=(',',':')))
          PYINVENTORY
