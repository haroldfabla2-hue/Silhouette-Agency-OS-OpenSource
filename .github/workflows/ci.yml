name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, fix/memory-p0-transactional-20260929]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Floor required by package.json engines (Stagehand needs >=22.18) plus latest 22.x.
        node-version: ['22.18.0', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Install real Linux sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp2
          # Ubuntu AppArmor otherwise denies CI runner user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Install pinned Chrome for Testing (puppeteer real-path tests)
        # Pinned to PUPPETEER_REVISIONS.chrome of the locked puppeteer version (25.18.0 -> 157.0.8103.78);
        # npx --no-install forces the repo-local pinned puppeteer CLI (no implicit unpinned fetch).
        run: npx --no-install puppeteer browsers install chrome@157.0.8103.78

      - name: F0 verification coverage and hermetic legacy checks
        run: npx vitest run tests/automated/help-protocol.test.ts tests/automated/legacy-hermetic.test.ts tests/automated/verification-inventory.test.ts

      - name: Real process boot gates and provider OFF/ON transport
        run: |
          bwrap --unshare-user --uid 0 --gid 0 --unshare-net --cap-add CAP_NET_ADMIN \
            --ro-bind / / --proc /proc --dev-bind /dev /dev --tmpfs /tmp \
            --ro-bind "$PWD" /tmp/project \
            /bin/bash -c 'ip link set lo up; cd /tmp/project; env -i PATH="$PATH" HOME=/tmp python3 tests/real-process/run-boot-checks.py /tmp/project/node_modules/.bin/tsx'

      - name: Production provider-OFF local API authentication (disposable data)
        run: |
          fixture=$(mktemp -d)
          git archive HEAD | tar -xf - -C "$fixture"
          rm -f "$fixture/.env" "$fixture/.env.local"
          mkdir -p "$fixture/db"
          touch "$fixture/FIXTURE_ONLY"
          ln -s "$PWD/node_modules" "$fixture/node_modules"
          bwrap --unshare-user --uid 0 --gid 0 --unshare-net --cap-add CAP_NET_ADMIN \
            --ro-bind / / --proc /proc --dev-bind /dev /dev --tmpfs /tmp \
            --bind "$fixture" /tmp/work \
            /bin/bash -c 'ip link set lo up; env -i PATH="$PATH" HOME=/tmp python3 /tmp/work/tests/real-process/production-off-auth.py'

      - name: Desktop ownership boundary contracts (not full product validation)
        run: node --test tests/desktop-session/*.node.cjs

      - name: Focused data evidence and oracle contracts (actual installed TS loader)
        timeout-minutes: 12
        run: |
          set +e
          set -uo pipefail
          failed=0
          for fixture in tests/contracts/*.test.mjs tests/complete-deps/*.test.mjs; do
            echo "FIXTURE_BEGIN $fixture"
            timeout --signal=TERM --kill-after=10s 180s node --import tsx/esm --test --test-timeout=120000 "$fixture"
            result=$?
            echo "FIXTURE_END $fixture exit=$result"
            if test "$result" -ne 0; then failed=1; fi
          done
          exit "$failed"

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npx vite build --config vite.server.config.ts

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'

      - name: NPM Audit
        run: npm audit --audit-level=high || true

      - name: Check for known vulnerabilities
        run: npx audit-ci --high
        continue-on-error: true

  build-check:
    name: Windows Build Verification (frontend + server)
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: npx vite build --config vite.server.config.ts

      - name: Electron Builder dry-run
        run: npx electron-builder build --win --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged files
        shell: pwsh
        run: |
          $requiredFiles = @(
            'dist-desktop/win-unpacked/resources/app.asar',
            'dist-desktop/win-unpacked/resources/splash.html'
          )
          foreach ($file in $requiredFiles) {
            if (Test-Path $file) {
              Write-Host "✅ Found: $file"
            } else {
              Write-Host "❌ Missing: $file"
              exit 1
            }
          }
          # Compare the actual unpacked Windows resources to the owning SQL.
          $sourceSql = Get-ChildItem 'db/migrations/sqlite' -File | Sort-Object Name
          $packagedSql = Get-ChildItem 'dist-desktop/win-unpacked/resources/migrations/sqlite' | Sort-Object Name
          if ($sourceSql.Count -ne 8 -or $packagedSql.Count -ne 8) {
            throw 'Expected exactly eight packaged SQLite migration assets'
          }
          for ($i = 0; $i -lt $sourceSql.Count; $i++) {
            if ($sourceSql[$i].Name -ne $packagedSql[$i].Name -or $packagedSql[$i].PSIsContainer) {
              throw 'Packaged SQLite migration asset names differ'
            }
            if ((Get-FileHash $sourceSql[$i].FullName -Algorithm SHA256).Hash -ne (Get-FileHash $packagedSql[$i].FullName -Algorithm SHA256).Hash) {
              throw 'Packaged SQLite migration asset bytes differ'
            }
          }
          Write-Host '✅ All required packaged files present'

      - name: Verify native modules unpacked from asar
        shell: pwsh
        run: |
          # Uses the LOCKED @electron/asar API (scripts/verify-native-unpack.cjs):
          # every native payload under the three configured asarUnpack roots must
          # be metadata-marked unpacked in the asar header AND exist on disk
          # outside the archive. Presence does not prove runtime load.
          node scripts/verify-native-unpack.cjs
          if ($LASTEXITCODE -ne 0) { throw "native unpack verification failed (exit $LASTEXITCODE)" }

      - name: Upload win-unpacked inventory
        shell: pwsh
        run: |
          Get-ChildItem 'dist-desktop/win-unpacked' -Recurse -File |
            ForEach-Object { "{0}|{1}" -f $_.FullName.Substring((Get-Location).Path.Length + 1), $_.Length } |
            Sort-Object | Out-File -Encoding utf8 win-unpacked-inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: win-unpacked-inventory
          path: win-unpacked-inventory.txt
          retention-days: 30

  nsis-installer-smoke:
    name: NSIS installer build (no publish, no signing)
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: node node_modules/vite/bin/vite.js build --config vite.server.config.ts

      - name: Build NSIS installer without publishing or signing
        run: node node_modules/electron-builder/cli.js build --win nsis --publish never
        env:
          # Signing disabled explicitly per app-builder-lib 26.18.1 source:
          # windowsSignToolManager skips when WIN_CSC_LINK/CSC_LINK are empty,
          # flags.js treats CSC_IDENTITY_AUTO_DISCOVERY=false as discovery off.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          WIN_CSC_LINK: ''

      - name: Verify installer artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'dist-desktop/*-Setup-*.exe' -File
          if ($setup.Count -ne 1) { throw "Expected exactly one NSIS Setup exe, found $($setup.Count)" }
          if (-not (Test-Path 'dist-desktop/latest.yml')) { throw 'Missing latest.yml updater metadata' }
          Write-Host "✅ NSIS installer: $($setup[0].Name) ($($setup[0].Length) bytes)"
          Get-Content 'dist-desktop/latest.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: nsis-installer-smoke
          path: |
            dist-desktop/*-Setup-*.exe
            dist-desktop/latest.yml
            dist-desktop/*.blockmap
          retention-days: 7

# Exact proposed additional job under existing CI jobs, no launch step.
  daemon-capsule-preparation:
    name: Prepare genuine Redis daemon capsule (no product execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Existing locked dependencies on disposable runner
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'
      - name: Install test runtime without starting host services
        shell: bash
        run: |
          set -euo pipefail
          sudo bash <<'ROOT'
          set -euo pipefail
          saved=$(mktemp -d)
          had_policy=0
          if test -e /usr/sbin/policy-rc.d; then
            cp -a /usr/sbin/policy-rc.d "$saved/policy-rc.d"
            had_policy=1
          fi
          cleanup() {
            rm -f /usr/sbin/policy-rc.d
            if test "$had_policy" = 1; then cp -a "$saved/policy-rc.d" /usr/sbin/policy-rc.d; fi
            rm -rf "$saved"
          }
          trap cleanup EXIT
          rm -f /usr/sbin/policy-rc.d
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          systemctl mask --runtime redis.service redis-server.service
          if pgrep -x redis-server; then echo 'Unexpected preexisting Redis' >&2; exit 1; fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends redis-server redis-tools bubblewrap iproute2 util-linux libseccomp2
          if pgrep -x redis-server; then echo 'Unexpected Redis autostart' >&2; exit 1; fi
          ROOT
      - name: Compile and audit exact finite capsule, no product evaluation
        run: python3 tests/daemon-real-redis/prepare_capsule.py
      - uses: actions/upload-artifact@v4
        with:
          name: actual-daemon-redis-capsule-review
          path: daemon-capsule-review/
          retention-days: 2
          if-no-files-found: error
