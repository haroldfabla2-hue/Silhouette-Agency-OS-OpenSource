# INACTIVE review copy. Intended target only after explicit publication approval:
# .github/workflows/adapter-acquisition-systemd-once.yml
name: One adapter acquisition boundary batch, not full application
on:
  push:
    branches: [fix/shutdown-contracts-narrow-20261117]
    paths: [.github/workflows/adapter-acquisition-systemd-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: adapter-acquisition-pr226-once
  cancel-in-progress: false
jobs:
  directed-narrative:
    if: github.repository == 'haroldfabla2-hue/Silhouette-Agency-OS-OpenSource' && github.ref == 'refs/heads/fix/shutdown-contracts-narrow-20261117' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - id: guard
        name: Exact single-child source and inactive payload guard
        env:
          EVENT_HEAD: ${{ github.sha }}
        run: |
          python3 -I -B -S - <<'PY'
          import importlib.util,os,pathlib
          p=pathlib.Path('tests/adapter-acquisition-systemd-activation/launch.INACTIVE.py').resolve()
          spec=importlib.util.spec_from_file_location('adapter_launch',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.guard(pathlib.Path.cwd(),os.environ['EVENT_HEAD'])
          PY
      - id: preparation
        name: Real full types then exact public reconstruction, no runtime
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.sha }}
        run: |
          timeout --signal=TERM --kill-after=10s 900s python3 -I -B -S - <<'PY'
          import importlib.util,os,pathlib
          p=pathlib.Path('tests/adapter-acquisition-systemd-activation/launch.INACTIVE.py').resolve()
          spec=importlib.util.spec_from_file_location('adapter_launch',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.phase('prepare',pathlib.Path.cwd(),os.environ['EVENT_HEAD'])
          PY
      - name: Seal only reviewed public payload and type receipt before root use
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C chown -R root:root /tmp/adapter-reviewed-payload
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C chmod -R a-w /tmp/adapter-reviewed-payload
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C chown root:root /tmp/adapter-real-typecheck/receipt.json
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C chmod 0600 /tmp/adapter-real-typecheck/receipt.json
      - id: hosted-context
        name: Current authenticated context, no credentials to root or runtime
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_RUNNER_NAME: ${{ runner.name }}
          CURRENT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 -I -B -S - <<'PY'
          import importlib.util,os,pathlib
          p=pathlib.Path('tests/adapter-acquisition-systemd-activation/launch.INACTIVE.py').resolve()
          spec=importlib.util.spec_from_file_location('adapter_launch',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.phase('context',pathlib.Path.cwd(),os.environ['EVENT_HEAD'])
          PY
          unset GH_TOKEN
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C chown root:root /tmp/narrative-directed-hosted-job.json
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C chmod 0600 /tmp/narrative-directed-hosted-job.json
      - id: batch
        name: Exactly one isolated eight-case boundary batch, no retry
        env:
          EVENT_HEAD: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_JOB_ID: ${{ steps.hosted-context.outputs.jobId }}
          EXPECTED_SNAPSHOT_SHA256: ${{ steps.hosted-context.outputs.snapshotSha256 }}
          EXPECTED_RUNNER_NAME: ${{ runner.name }}
          EXPECTED_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          timeout --signal=TERM --kill-after=15s 100s sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C EVENT_HEAD="$EVENT_HEAD" EXPECTED_RUN_ID="$EXPECTED_RUN_ID" EXPECTED_RUN_ATTEMPT="$EXPECTED_RUN_ATTEMPT" EXPECTED_JOB_ID="$EXPECTED_JOB_ID" EXPECTED_SNAPSHOT_SHA256="$EXPECTED_SNAPSHOT_SHA256" EXPECTED_RUNNER_NAME="$EXPECTED_RUNNER_NAME" EXPECTED_RUNNER_ENVIRONMENT="$EXPECTED_RUNNER_ENVIRONMENT" /usr/bin/python3 -I -B -S - <<'PY'
          import importlib.util,os,pathlib
          p=pathlib.Path('tests/adapter-acquisition-systemd-activation/launch.INACTIVE.py').resolve()
          spec=importlib.util.spec_from_file_location('adapter_launch',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.phase('run',pathlib.Path.cwd(),os.environ['EVENT_HEAD'])
          PY
      - id: export
        name: Bounded selected public types and boundary evidence, never raw environment
        if: always() && steps.guard.outcome == 'success'
        env:
          EVENT_HEAD: ${{ github.sha }}
        run: |
          timeout --signal=TERM --kill-after=5s 30s sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C EVENT_HEAD="$EVENT_HEAD" /usr/bin/python3 -I -B -S - <<'PY'
          import importlib.util,os,pathlib
          p=pathlib.Path('tests/adapter-acquisition-systemd-activation/launch.INACTIVE.py').resolve()
          spec=importlib.util.spec_from_file_location('adapter_launch',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          m.phase('export',pathlib.Path.cwd(),os.environ['EVENT_HEAD'])
          PY
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C chmod -R a+rX /tmp/adapter-final-selected
      - uses: actions/upload-artifact@v4
        if: always() && steps.export.outcome == 'success'
        with:
          name: adapter-boundary-eight-selected-evidence
          path: /tmp/adapter-final-selected/*
          if-no-files-found: error
          retention-days: 2
