          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify pinned payload and capture event
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B -S - "$PAYLOAD/bootstrap.INACTIVE.py" "$BOOT_PIN" "$ROOT_PIN" event /tmp/daemon-fs-event.json <<'PY'
          import hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1]);raw=p.read_bytes()
          if hashlib.sha256(raw).hexdigest()!=sys.argv[2]:raise SystemExit('EXTERNAL_BOOTSTRAP_PIN')
          root=sys.argv[3]
          if hashlib.sha256((p.parent/'SHA256.json').read_bytes()).hexdigest()!=root:raise SystemExit('EXTERNAL_MANIFEST_PIN')
          sys.argv=[str(p),sys.argv[4],root,*sys.argv[5:]]
          exec(compile(raw,str(p),'exec'),{'__name__':'__main__','__file__':str(p)})
          PY
